name: Build APK and publish release

# Push a tag like v2.1 (git tag v2.1 && git push origin v2.1) -> a signed APK appears under Releases.
# The app checks the latest Release and shows "Update available".
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - the APK will be debug-signed and cannot update an installed release."
          fi

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VER="0.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/FB-IDs-Vault-v${VERSION_NAME}.apk"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Keep APK as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: FB-IDs-Vault-apk
          path: dist/*.apk
